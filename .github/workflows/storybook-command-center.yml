name: Storybook command center
on:
  pull_request:
    branches: [main]
    paths: ['command-center-98/**', 'scripts/storybook*', 'scripts/paper*', '.github/workflows/storybook-command-center.yml']
permissions:
  contents: read
jobs:
  owner-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/paper-browser.cjs
      - run: node command-center-98/app-loader.test.cjs
      - run: npm install --prefix "$RUNNER_TEMP/storybook-unit" --ignore-scripts --no-audit --no-fund jsdom@26.1.0 linkedom@0.18.13
      - run: NODE_PATH="$RUNNER_TEMP/storybook-unit/node_modules" node --test scripts/paper-fold.test.mjs scripts/threads-images-api.test.mjs scripts/threads-images-ui.test.cjs scripts/paper-stage.test.mjs scripts/paper-detail-layout.test.mjs scripts/storybook-*.test.mjs scripts/storybook-workbench-entry.test.cjs scripts/castle-spatial-desk.test.mjs scripts/castle-living-model.test.mjs scripts/castle-living-room.test.mjs scripts/eight-panel-dom.test.mjs scripts/six-account-board.test.mjs
  actual-paper-default:
    name: Paper default (${{ matrix.viewport.width }}×${{ matrix.viewport.height }} / ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        viewport:
          - {width: 320, height: 640}
          - {width: 390, height: 900}
          - {width: 800, height: 648}
          - {width: 800, height: 800}
          - {width: 800, height: 900}
          - {width: 1440, height: 900}
        mode: [reduced, normal, eight-no-art]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/paper" --ignore-scripts --no-audit --no-fund playwright-core@1.62.1
      - run: node "$RUNNER_TEMP/paper/node_modules/playwright-core/cli.js" install --with-deps --no-shell chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      # Real default host and owner. Only source data/network are fixture-scoped.
      # Old illustration/passage behavior remains covered in owner-graph units.
      - name: Long manuscript layout and existing behavior
        run: NODE_PATH="$RUNNER_TEMP/paper/node_modules" node scripts/paper-browser.cjs
        env:
          PAPER_WIDTH: ${{ matrix.viewport.width }}
          PAPER_HEIGHT: ${{ matrix.viewport.height }}
          PAPER_IMAGES: '1'
          PAPER_OUT: artifacts/paper/long
          PAPER_MOTION: ${{ matrix.mode == 'normal' && 'normal' || '' }}
          PAPER_EIGHT: ${{ matrix.mode == 'eight-no-art' && '1' || '' }}
          PAPER_NO_ART: ${{ matrix.mode == 'eight-no-art' && '1' || '' }}
      - name: Short manuscript layout and existing behavior
        if: success() || failure()
        run: NODE_PATH="$RUNNER_TEMP/paper/node_modules" node scripts/paper-browser.cjs
        env:
          PAPER_WIDTH: ${{ matrix.viewport.width }}
          PAPER_HEIGHT: ${{ matrix.viewport.height }}
          PAPER_IMAGES: '1'
          PAPER_OUT: artifacts/paper/short
          PAPER_SHORT: '1'
          PAPER_MOTION: ${{ matrix.mode == 'normal' && 'normal' || '' }}
          PAPER_EIGHT: ${{ matrix.mode == 'eight-no-art' && '1' || '' }}
          PAPER_NO_ART: ${{ matrix.mode == 'eight-no-art' && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-${{ matrix.viewport.width }}-${{ matrix.viewport.height }}-${{ matrix.mode }}
          path: artifacts/paper
          if-no-files-found: error
  paper-lifecycle:
    name: Paper lifecycle (${{ matrix.width }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        width: [320, 390, 800, 1440]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/lifecycle" --ignore-scripts --no-audit --no-fund playwright-core@1.62.1
      - run: node "$RUNNER_TEMP/lifecycle/node_modules/playwright-core/cli.js" install --with-deps --no-shell chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: NODE_PATH="$RUNNER_TEMP/lifecycle/node_modules" node scripts/paper-lifecycle-browser.cjs
        env:
          PAPER_WIDTH: ${{ matrix.width }}
          PAPER_HEIGHT: ${{ matrix.width == 800 && 648 || matrix.width == 320 && 640 || 900 }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-lifecycle-${{ matrix.width }}
          path: artifacts/paper-lifecycle
          if-no-files-found: error
