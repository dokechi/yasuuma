name: Storybook command center
on:
  pull_request:
    branches: [main]
    paths: ['command-center-98/**', 'scripts/storybook*', '.github/workflows/storybook-command-center.yml']
permissions:
  contents: read
jobs:
  owner-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/storybook-browser.cjs
      - run: node command-center-98/app-loader.test.cjs
      - run: npm install --prefix "$RUNNER_TEMP/storybook-unit" --ignore-scripts --no-audit --no-fund jsdom@26.1.0 linkedom@0.18.13
      - run: NODE_PATH="$RUNNER_TEMP/storybook-unit/node_modules" node --test scripts/storybook-*.test.mjs scripts/storybook-workbench-entry.test.cjs scripts/castle-spatial-desk.test.mjs scripts/castle-living-model.test.mjs scripts/castle-living-room.test.mjs scripts/eight-panel-dom.test.mjs
  actual-default:
    name: Storybook default (${{ matrix.width }}x${{ matrix.height }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {width: 320, height: 640}
          - {width: 390, height: 900}
          - {width: 800, height: 648}
          - {width: 1440, height: 900}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/storybook" --ignore-scripts --no-audit --no-fund playwright-core@1.62.1
      - run: node "$RUNNER_TEMP/storybook/node_modules/playwright-core/cli.js" install --with-deps --no-shell chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      # The real production host loads its real default. Only data responses are synthetic.
      - run: NODE_PATH="$RUNNER_TEMP/storybook/node_modules" node scripts/storybook-browser.cjs
        env:
          STORY_WIDTH: ${{ matrix.width }}
          STORY_HEIGHT: ${{ matrix.height }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook-${{ matrix.width }}-${{ matrix.height }}
          path: artifacts/storybook/${{ matrix.width }}-${{ matrix.height }}
          if-no-files-found: error

  normal-motion:
    name: Storybook motion (${{ matrix.width }}x${{ matrix.height }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {width: 320, height: 640}
          - {width: 390, height: 900}
          - {width: 800, height: 648}
          - {width: 1440, height: 900}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/storybook-motion-browser.cjs
      - run: npm install --prefix "$RUNNER_TEMP/storybook-motion" --ignore-scripts --no-audit --no-fund playwright-core@1.62.1 pngjs@7.0.0
      - run: node "$RUNNER_TEMP/storybook-motion/node_modules/playwright-core/cli.js" install --with-deps --no-shell chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      # Real default, ordinary UI and WAAPI; no route/owner substitution or private seek API.
      - run: NODE_PATH="$RUNNER_TEMP/storybook-motion/node_modules" node scripts/storybook-motion-browser.cjs
        env:
          STORY_WIDTH: ${{ matrix.width }}
          STORY_HEIGHT: ${{ matrix.height }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook-motion-${{ matrix.width }}-${{ matrix.height }}
          path: artifacts/storybook-motion/${{ matrix.width }}-${{ matrix.height }}
          if-no-files-found: error

  optional-fallback:
    name: Storybook fallback (${{ matrix.width }}x${{ matrix.height }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {width: 320, height: 640}
          - {width: 800, height: 648}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/storybook-fallback-browser.cjs
      - run: npm install --prefix "$RUNNER_TEMP/storybook-fallback" --ignore-scripts --no-audit --no-fund playwright-core@1.62.1
      - run: node "$RUNNER_TEMP/storybook-fallback/node_modules/playwright-core/cli.js" install --with-deps --no-shell chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      # One missing optional asset per fresh context, real default host/controllers.
      - run: NODE_PATH="$RUNNER_TEMP/storybook-fallback/node_modules" node scripts/storybook-fallback-browser.cjs
        env:
          STORY_WIDTH: ${{ matrix.width }}
          STORY_HEIGHT: ${{ matrix.height }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook-fallback-${{ matrix.width }}-${{ matrix.height }}
          path: artifacts/storybook-fallback/${{ matrix.width }}-${{ matrix.height }}
          if-no-files-found: error

  work-first:
    name: Working first page (${{ matrix.width }}x${{ matrix.height }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {width: 320, height: 640}
          - {width: 390, height: 900}
          - {width: 800, height: 648}
          - {width: 1440, height: 900}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check scripts/storybook-work-first-browser.cjs && node --check scripts/storybook-working-motion-browser.cjs
      - run: npm install --prefix "$RUNNER_TEMP/work-first" --ignore-scripts --no-audit --no-fund playwright-core@1.62.1 pngjs@7.0.0
      - run: node "$RUNNER_TEMP/work-first/node_modules/playwright-core/cli.js" install --with-deps --no-shell chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: NODE_PATH="$RUNNER_TEMP/work-first/node_modules" node scripts/storybook-work-first-browser.cjs
        env:
          STORY_WIDTH: ${{ matrix.width }}
          STORY_HEIGHT: ${{ matrix.height }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook-work-first-${{ matrix.width }}-${{ matrix.height }}
          path: artifacts/storybook-work-first/${{ matrix.width }}-${{ matrix.height }}
          if-no-files-found: error
      - run: NODE_PATH="$RUNNER_TEMP/work-first/node_modules" node scripts/storybook-working-motion-browser.cjs
        if: ${{ !cancelled() }}
        env:
          STORY_WIDTH: ${{ matrix.width }}
          STORY_HEIGHT: ${{ matrix.height }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook-working-motion-${{ matrix.width }}-${{ matrix.height }}
          path: artifacts/storybook-working-motion/${{ matrix.width }}-${{ matrix.height }}
          if-no-files-found: error
