name: Isolated castle spatial prototype
on:
  push:
    branches: ['codex/castle-spatial-prototype-20261031']
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check command-center-98/lounge/castle-scene.js && node --check command-center-98/lounge/spatial-desk.js
      - run: npm install --prefix "$RUNNER_TEMP/ui" --ignore-scripts --no-audit --no-fund playwright-core@1.62.1
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: NODE_PATH="$RUNNER_TEMP/ui/node_modules" node scripts/castle-spatial-prototype-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: castle-spatial-prototype
          path: artifacts/castle-spatial-prototype
