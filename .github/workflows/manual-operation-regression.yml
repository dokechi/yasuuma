name: Manual operation regression
on:
  push:
    branches:
      - 'codex/manual-confirmation-20261008'
      - 'codex/command-center-save-safety-*'
      - 'codex/command-center-save-consistency-*'
      - 'codex/command-center-hold-count-*'
      - 'codex/command-center-market-evidence-*'
      - 'codex/command-center-sourcing-render-*'
      - 'codex/command-center-sourcing-mobile-*'
    paths:
      - 'command-center-98/**'
      - 'scripts/**'
      - 'supabase/functions/**'
      - '.github/workflows/manual-operation-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'command-center-98/**'
      - 'scripts/**'
      - 'supabase/functions/**'
      - '.github/workflows/manual-operation-regression.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Type check save and sourcing contracts
        run: >-
          npm exec --yes --package=typescript@5.9.3 --
          tsc --noEmit --allowJs --checkJs --target es2022 --module nodenext --moduleResolution nodenext
          supabase/functions/command-center-retro-api/guarded-payload.mjs
          supabase/functions/command-center-retro-api/sourcing-read-model.mjs
      - name: Isolated PostgreSQL fixture runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/save-fixture" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.4.6
          echo "PGLITE_MODULE=$RUNNER_TEMP/save-fixture/node_modules/@electric-sql/pglite/dist/index.js" >> "$GITHUB_ENV"
      - name: Daily reading desk DOM integration
        run: |
          npm install --prefix "$RUNNER_TEMP/daily-dom" --ignore-scripts --no-audit --no-fund linkedom@0.18.13 playwright-core@1.62.1 jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node --test scripts/rpg-daily-desk.test.cjs
          cd command-center-98/castle
          NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node --test tests/*.test.cjs
          cd ../..
          NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node scripts/castle-art-browser.cjs
          NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node scripts/castle-workflow-browser.cjs
          NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node scripts/threads-product-links-browser.cjs
          NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node scripts/request-progress-shortcut-browser.cjs
          NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node --test scripts/castle-record-route.test.cjs
          CC_UX_MODE=operations NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node scripts/castle-ux-browser.cjs
          CC_UX_MODE=map NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node scripts/castle-ux-browser.cjs
          NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node scripts/unified-castle-browser.cjs
          NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node scripts/castle-music-browser.cjs
          NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node scripts/castle-shuffle-browser.cjs
          NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node scripts/castle-audio-default-browser.cjs
          NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node scripts/castle-back-browser.cjs
          NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node scripts/castle-flash-browser.cjs
          NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node scripts/castle-home-browser.cjs
          NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node scripts/castle-paper-theme-browser.cjs
          NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node scripts/threads-archive-browser.cjs
          NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node scripts/sourcing-archive-browser.cjs
          NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node scripts/castle-polish-browser.cjs
      - name: Syntax and manual operation contracts
        env:
          REQUIRE_THREADS_SQL: "1"
        run: |
          node --check command-center-98/fp-finished-images.js
          node --check command-center-98/manual-operation-hub.js
          node --check command-center-98/affiliate-production.js
          node scripts/manual-posting.test.cjs
          node scripts/manual-operation-state.test.cjs
          node scripts/manual-operation-hub-ui.test.cjs
          node scripts/manual-operation-hub-safety.test.cjs
          node scripts/rpg-account-pages.test.cjs
          node scripts/threads-manual-ui.test.cjs
          NODE_PATH="$RUNNER_TEMP/daily-dom/node_modules" node scripts/threads-images-ui.test.cjs
          node --test scripts/threads-product-links.test.cjs
          node --test scripts/request-progress-login-hash.test.cjs
          node --test scripts/threads-manual-api.test.mjs scripts/threads-images-api.test.mjs scripts/castle-signals.test.mjs scripts/threads-archive.test.mjs scripts/sourcing-archive.test.mjs
          node command-center-98/rpg-home.test.cjs
          node command-center-98/rpg-workspaces.test.cjs
          node scripts/fp-finished-images.test.mjs
          node --test scripts/affiliate-production-api.test.mjs scripts/affiliate-production.test.mjs
          node --test scripts/command-center-save-safety.test.mjs scripts/card-jst-display.test.mjs scripts/save-consistency.test.mjs
          node --check command-center-98/v221-sourcing-hold-first.js
          node --test command-center-98/v221-sourcing-hold-count.test.cjs
          node --check command-center-98/v229-sourcing-mercari-history.js
          node --test command-center-98/v229-sourcing-mercari-history.test.cjs
          node --check command-center-98/sourcing-display-model.js
          node --check command-center-98/v216-sourcing-status-flow.js
          node --test command-center-98/sourcing-display-model.test.cjs
          node --check command-center-98/sourcing-mobile-comparison.js
      - name: Mobile and desktop sourcing in real Chrome
        run: node --test scripts/sourcing-mobile-browser.test.mjs scripts/save-consistency-browser.test.mjs
      - name: Japanese system font for screenshot review
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: RPG theme all-page browser screenshots and geometry
        run: node --test scripts/rpg-theme-browser.test.mjs
      - name: Upload RPG route screenshots and check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-theme-browser-screenshots
          path: artifacts/rpg-theme/
          if-no-files-found: error
          retention-days: 14
      - name: Existing loader, home and FP regressions
        run: |
          node command-center-98/app-loader.test.cjs
          node command-center-98/home-read-model.test.cjs
          node command-center-98/command-center-data.test.cjs
          node command-center-98/individual-image-handoff.test.cjs
          node command-center-98/v226-adaptive-carousel.test.cjs
          node command-center-98/v228-money-full-copy.test.cjs
          node scripts/test-money-theme-adaptive.cjs
