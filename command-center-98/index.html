<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>司令塔</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#008080;font-family:Tahoma,"MS UI Gothic","MS Gothic",sans-serif;display:grid;place-items:center;color:#111;padding:16px}.box{width:min(520px,100%);background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:2px 2px #000}.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:700;padding:4px 7px}.body{padding:18px}.bar{height:20px;border:2px solid;border-color:#808080 #fff #fff #808080;background:#fff;padding:2px;overflow:hidden}.fill{height:100%;width:35%;background:#000080;animation:move 1s linear infinite}@keyframes move{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}.err{color:#900;font-weight:700}.field{margin:14px 0 10px}.field label{display:block;font-weight:700;margin-bottom:5px}.field input{width:100%;min-height:34px;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px #000;padding:5px 7px;font:inherit;outline:none}.btn{min-height:32px;padding:4px 14px;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080,inset 1px 1px #dfdfdf;font:inherit;font-weight:700;cursor:pointer}.btn:active{border-color:#000 #fff #fff #000;box-shadow:inset 1px 1px #808080;transform:translate(1px,1px)}.note{font-size:12px;color:#333;margin:10px 0 0}.status{margin-top:12px;min-height:20px}.hidden{display:none}
</style>
</head>
<body>
<div class="box">
 <div class="title" id="title">司令塔 - PERSONAL COMMAND CENTER</div>
 <div class="body">
  <b>PRIVATE COMMAND CENTER</b>
  <div id="loginPane" class="hidden">
   <p>司令塔専用のアクセスコードを入力してください。</p>
   <form id="loginForm"><div class="field"><label for="code">アクセスコード</label><input id="code" type="password" autocomplete="current-password" required></div><button class="btn" id="loginBtn" type="submit">司令塔を開く</button></form>
   <p class="note">このブラウザではログイン状態を30日保持します。</p><div class="status err" id="loginError"></div>
  </div>
  <div id="loadingPane"><p id="msg">司令塔 ver 1.40 を起動しています...</p><div class="bar"><div class="fill"></div></div></div>
 </div>
</div>
<script>
const AUTH_API='https://yibtmqsbyodhsudenktm.supabase.co/functions/v1/command-center-retro-api';
const TOKEN_KEY='cc_retro_token';
function showLogin(message=''){document.getElementById('loadingPane').classList.add('hidden');document.getElementById('loginPane').classList.remove('hidden');document.getElementById('title').textContent='司令塔 - ログイン';document.getElementById('loginError').textContent=message;setTimeout(()=>document.getElementById('code').focus(),0)}
function showLoading(message='司令塔 ver 1.40 を起動しています...'){document.getElementById('loginPane').classList.add('hidden');document.getElementById('loadingPane').classList.remove('hidden');document.getElementById('title').textContent='司令塔 - 起動中';document.getElementById('msg').textContent=message}
async function ping(token){const r=await fetch(AUTH_API+'?ping=1',{headers:{Authorization:'Bearer '+token},cache:'no-store'});return r.ok}
async function boot(){const token=localStorage.getItem(TOKEN_KEY)||'';if(!token||!(await ping(token).catch(()=>false))){localStorage.removeItem(TOKEN_KEY);showLogin();return}showLoading('認証済み。司令塔を開いています...');location.replace('app-v130.html?v=140')}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('loginBtn'),code=document.getElementById('code').value;btn.disabled=true;document.getElementById('loginError').textContent='';showLoading('アクセスコードを確認しています...');try{const r=await fetch(AUTH_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',access_code:code})});const d=await r.json();if(!r.ok||!d?.ok||!d?.token)throw new Error(r.status===401?'アクセスコードが違います':'認証に失敗しました');localStorage.setItem(TOKEN_KEY,d.token);location.replace('app-v130.html?v=140')}catch(err){showLogin(err.message||String(err));btn.disabled=false}});
boot();
</script>
</body>
</html>
