  <style>
    html,body{height:100%;margin:0;background:#008080;font-family:Tahoma,"MS UI Gothic",sans-serif;color:#fff;display:grid;place-items:center}
    .boot{background:#c0c0c0;color:#111;border:2px solid;border-color:#fff #000 #000 #fff;padding:16px;min-width:300px}
    .bar{height:18px;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:2px}
    .fill{height:100%;background:#000080;width:45%;animation:m 1s linear infinite}
    @keyframes m{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

<body>
