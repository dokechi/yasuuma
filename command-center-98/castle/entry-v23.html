<body>
<div id="app" class="app" data-view="home" data-place="kyun">

 <header class="topbar"><a class="brand" href="#" id="brand"><span class="brand-mark" aria-hidden="true">✧</span>司令塔<span class="brand-sub">THE CASTLE TOWN</span></a><span class="trial">司令塔</span><button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false" aria-label="効果音をオンにする"><span>音 OFF</span></button><a class="original" href="https://dokechi.github.io/yasuuma/command-center-98/app-v130.html?v=141" >全機能・設定</a></header>
 <main id="home" class="home">
  <div class="home-heading"><div><p class="eyebrow">灯りのある場所へ</p><h1>今日は、どこから？</h1></div><span class="town-time" id="townTime"></span></div>
  <div class="home-tools"><button id="resumeWork" type="button" hidden>前回の続きへ</button><div class="view-controls"><button id="homeMode" type="button" aria-pressed="false">街マップ</button><button id="settingsOpen" type="button" aria-label="表示と操作の設定">設定</button></div></div>
  <nav class="stations" aria-label="仕事を選ぶ">
   <button class="station" id="enter" data-place="kyun" aria-controls="workspace"><span class="station-no">01 <span>THREADS</span></span><span class="portrait"><span class="sprite"><img src="assets/scene-kyun-welcome-v1.jpg" alt="" fetchpriority="high"><span class="blink-window" aria-hidden="true"><img class="blink-overlay" alt="" decoding="async"></span></span></span><span class="station-light"></span><span class="reward-stars" aria-hidden="true">✧ · ✦ · ✧</span><span class="station-label"><span class="station-title">キュン拾い</span><span class="station-detail">原稿を選ぶ・コピー</span><span class="station-status" aria-live="off"></span><span class="station-arrow" aria-hidden="true">↗</span></span></button>
   <button class="station" id="enter-choi" data-place="choi" aria-controls="workspace"><span class="station-no">02 <span>SELECTION</span></span><span class="portrait"><span class="sprite"><img src="assets/scene-choi-welcome-v1.jpg" alt="" fetchpriority="high"><span class="blink-window" aria-hidden="true"><img class="blink-overlay" alt="" decoding="async"></span></span></span><span class="station-light"></span><span class="reward-stars" aria-hidden="true">✧ · ✦ · ✧</span><span class="station-label"><span class="station-title">ちょい上等</span><span class="station-detail">紹介文を整える</span><span class="station-status" aria-live="off"></span><span class="station-arrow" aria-hidden="true">↗</span></span></button>
   <button class="station" id="enter-fp" data-place="fp" aria-controls="workspace"><span class="station-no">03 <span>STUDIO</span></span><span class="portrait"><span class="sprite"><img src="assets/fp.webp" alt="" fetchpriority="high"><span class="blink-window" aria-hidden="true"><img class="blink-overlay" alt="" decoding="async"></span></span></span><span class="station-light"></span><span class="reward-stars" aria-hidden="true">✧ · ✦ · ✧</span><span class="station-label"><span class="station-title">FP・TikTok</span><span class="station-detail">台本を確認する</span><span class="station-status" aria-live="off"></span><span class="station-arrow" aria-hidden="true">↗</span></span></button>
   <button class="station" id="enter-shiire" data-place="shiire" aria-controls="workspace"><span class="station-no">04 <span>MARKET</span></span><span class="portrait"><span class="sprite"><img src="assets/shiire.webp" alt="" fetchpriority="high"><span class="blink-window" aria-hidden="true"><img class="blink-overlay" alt="" decoding="async"></span></span></span><span class="station-light"></span><span class="reward-stars" aria-hidden="true">✧ · ✦ · ✧</span><span class="station-label"><span class="station-title">仕入れ</span><span class="station-detail">候補を見比べる</span><span class="station-status" aria-live="off"></span><span class="station-arrow" aria-hidden="true">↗</span></span></button>
  </nav>
  <nav id="productionShortcuts" aria-label="業務への近道"></nav><footer class="home-footer"><span><i class="small-diamond"></i>４つの持ち場へ、ひとタップ。</span><span>自分の原稿も、引き出しから</span></footer>
 </main>
 <section class="workspace" id="workspace" aria-labelledby="workspace-title" aria-hidden="true" inert>
  <div class="companion-stage"><section id="characterScenes" class="character-scenes" aria-label="キャラクターの場面" hidden>
 <div class="scene-frame" id="sceneFrame"><img id="sceneImage" alt="" decoding="async"><canvas id="sceneCanvas" class="scene-canvas" aria-hidden="true"></canvas><button id="sceneTouch" class="scene-touch" type="button" aria-label="キャラクターに話しかける"></button></div>
 <div class="scene-controls"><label><span class="visually-hidden">場面を選ぶ</span><select id="sceneSelect" aria-label="場面を選ぶ"><option value="auto">おまかせ</option><option value="welcome">お迎え</option><option value="work">仕事</option><option value="rest">休憩</option><option value="tea">お茶</option><option value="special">特別</option></select></label><button id="sceneExpand" type="button" aria-haspopup="dialog">全景 ↗</button><span id="sceneCurrent" aria-live="off"></span></div>
 </section><div class="dock" id="dock"><button class="character-touch" id="characterTouch" type="button" aria-label="キュン拾いのキャラに話しかける" title="タップでひと言"></button></div><div class="arrival-ring" aria-hidden="true"></div><div class="greeting"><span class="eyebrow" id="placeEyebrow">THREADS</span><p id="greetingText" aria-live="polite" aria-atomic="true">今日の一言、一緒に選ぼう。</p><span class="greeting-rule"></span></div></div>
  <div class="desk">
   <header class="desk-header"><button id="back" class="back" type="button" aria-label="司令塔へ戻る">← <span>司令塔</span></button><div><p id="placeType">原稿の持ち場</p><h2 id="workspace-title">キュン拾い</h2></div><button class="focus-button" id="focusMode" type="button" aria-pressed="false">集中</button><button class="switch-button" id="switch" type="button" aria-label="別の持ち場を選ぶ">⌘ <span>持ち場</span></button></header>
   <div id="productionTools" class="production-tools"></div><div class="paper">
    <div class="paper-heading"><h3 id="paperTitle">原稿を選ぶ</h3><div class="paper-heading-tools"><span class="sample-badge" id="draftCount">保存原稿</span><button id="deskMenu" type="button" aria-haspopup="dialog">引き出し <span aria-hidden="true">▤</span></button></div></div>
    <div class="draft-tabs" role="tablist" aria-label="原稿を選ぶ" aria-orientation="horizontal"><i class="draft-bookmark" aria-hidden="true"></i><button id="tab-0" role="tab" aria-controls="draft" aria-selected="true" data-draft="0"><span class="draft-number" aria-hidden="true">01</span> <span class="draft-kind">ひとこと</span><strong class="draft-preview-title" aria-hidden="true"></strong><span class="draft-preview-text" aria-hidden="true"></span></button><button id="tab-1" role="tab" aria-controls="draft" aria-selected="false" tabindex="-1" data-draft="1"><span class="draft-number" aria-hidden="true">02</span> <span class="draft-kind">紹介文</span><strong class="draft-preview-title" aria-hidden="true"></strong><span class="draft-preview-text" aria-hidden="true"></span></button><button id="tab-2" role="tab" aria-controls="draft" aria-selected="false" tabindex="-1" data-draft="2"><span class="draft-number" aria-hidden="true">03</span> <span class="draft-kind">長めの文</span><strong class="draft-preview-title" aria-hidden="true"></strong><span class="draft-preview-text" aria-hidden="true"></span></button></div>
    <div class="paper-reading"><div class="reading-meta"><button id="pinDraft" type="button" aria-pressed="false" aria-label="原稿をお気に入りに留める">☆ 留める</button><span id="copySeal" class="copy-seal" hidden>コピー済み</span><button id="doneStack" class="done-stack" type="button" aria-haspopup="dialog" aria-label="完了した原稿を見る">原稿束 <span id="doneCount">0</span></button></div><div class="paper-scroll" id="paperScroll"><article id="draft" class="draft" role="tabpanel" aria-labelledby="tab-0" tabindex="0"><p class="draft-label" id="draftLabel">投稿本文</p><h4 id="draftTitle"></h4><div class="draft-body" id="draftBody"></div></article><p class="sample-note" id="sampleNote">原稿と読書メモはこのブラウザに保存されます。</p></div><aside class="compare-pane" id="comparePane" hidden><header><span>比較する原稿</span><button id="closeCompare" type="button">閉じる</button></header><select id="compareSelect" aria-label="比較する原稿"></select><div class="compare-scroll"><h4 id="compareTitle"></h4><p id="compareBody"></p></div><button id="compareCopy" type="button">こちらの本文をコピー</button></aside><aside class="tray-rail" id="trayRail" hidden><header>仮置き皿<button id="closeTray" type="button">閉じる</button></header><div id="trayItems"></div></aside><div class="page-turn" id="pageTurn" aria-hidden="true"></div></div>
    <footer class="paper-actions"><button class="copy" id="copy" type="button"><span aria-hidden="true">▤</span> <span id="copyLabel">本文をコピー</span></button><button id="copyLink" class="copy-link" type="button" hidden>リンク</button><button class="return" id="return" type="button">完了 <span aria-hidden="true">↶</span></button></footer>
   </div>
   <nav class="place-switcher" aria-label="持ち場を切り替える"><button data-go="kyun" aria-label="キュン拾い">01 <span>キュン拾い</span></button><button data-go="choi" aria-label="ちょい上等">02 <span>ちょい上等</span></button><button data-go="fp" aria-label="FP・TikTok">03 <span>FP・TikTok</span></button><button data-go="shiire" aria-label="仕入れ">04 <span>仕入れ</span></button></nav>
  </div>
 </section>
 <div class="companion" id="companion" aria-hidden="true"><div class="companion-aura"></div><div class="sprite"><img id="character" src="assets/kyun-writer-v1.webp" alt=""><canvas class="character-rig" id="characterRig" aria-hidden="true"></canvas><canvas class="character-action" id="characterAction" aria-hidden="true"></canvas><span class="expression-window" aria-hidden="true"><img class="expression-overlay expression-reading" alt="" decoding="async"><img class="expression-overlay expression-open" alt="" decoding="async"><img class="expression-overlay expression-closed" alt="" decoding="async"></span><span class="blink-window" aria-hidden="true"><img class="blink-overlay" alt="" decoding="async"></span></div><div class="companion-sheen"></div></div>

 <dialog id="deskDrawer" class="desk-drawer"><header><h2 id="drawerTitle">机の引き出し</h2><button id="drawerClose" type="button" aria-label="引き出しを閉じる">×</button></header><div id="drawerBody"></div></dialog>
 <input id="importFile" type="file" accept="application/json,.json" hidden>
 <div id="copyFlight" class="copy-flight" aria-hidden="true">▤</div>
 <div id="toast" class="toast" role="status" aria-live="polite"></div>
 <dialog id="sceneDialog" class="scene-dialog" aria-labelledby="sceneTitle"><header><h2 id="sceneTitle">キャラクターの場面</h2><button id="sceneClose" type="button" aria-label="全景を閉じて原稿へ戻る">原稿へ戻る ×</button></header><div id="sceneFullFrame" class="scene-full-frame"><img id="sceneFullImage" alt="" decoding="async"><canvas id="sceneFullCanvas" class="scene-canvas" aria-hidden="true"></canvas><button id="sceneFullTouch" class="scene-touch" type="button" aria-label="キャラクターに話しかける"></button></div><footer><select id="sceneFullSelect" aria-label="全景の場面を選ぶ"><option value="auto">おまかせ</option><option value="welcome">お迎え</option><option value="work">仕事</option><option value="rest">休憩</option><option value="tea">お茶</option><option value="special">特別</option></select><p id="sceneCaption" aria-live="polite"></p></footer></dialog>
 <dialog id="copyFallback"><h2>本文をコピー</h2><p>本文を長押ししてコピーしてください。</p><textarea id="copyText" readonly aria-label="コピーする本文"></textarea><form method="dialog"><button id="manualCopied" value="copied">コピーした</button><button value="cancel">閉じる</button></form></dialog>
</div><script type="module" src="app.js?v=23"></script>
